[project]
name = "krypton-agent"
version = "1.0.0"
description = "Krypton — local autonomous personal agent with multi-provider LLM, surgical tool system, pattern learning and Telegram interface."
requires-python = ">=3.11"
authors = [{ name = "Riccardo" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "aiofiles>=23.2",
    "anyio>=4.4",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "tiktoken>=0.7",
    "duckduckgo-search>=6.1",
    "selectolax>=0.3.21",
    "python-telegram-bot>=21.4",
    "prompt-toolkit>=3.0",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
krypton = "krypton.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["krypton*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
